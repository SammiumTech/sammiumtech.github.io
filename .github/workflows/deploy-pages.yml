name: Deploy Sammium Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.2.0
          package-manager-cache: false

      - name: Pin stable npm
        run: npm install --global npm@10.8.0

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check workspaces
        run: npm run lint

      - name: Build portfolio and embedded projects
        run: npm run build:pages

      - name: Restore Midnight Circuit WebGL source
        run: |
          git restore --source=HEAD -- apps/portfolio/public/projects/midnight-circuit-webgl
          test -d apps/portfolio/public/projects/midnight-circuit-webgl

      - name: Force include Midnight Circuit WebGL build
        run: |
          mkdir -p apps/portfolio/dist/projects/midnight-circuit-webgl
          cp -R apps/portfolio/public/projects/midnight-circuit-webgl/. apps/portfolio/dist/projects/midnight-circuit-webgl/

      - name: Verify Midnight Circuit WebGL files
        run: |
          echo "Checking Midnight Circuit WebGL folder..."
          ls -la apps/portfolio/dist/projects/midnight-circuit-webgl

          echo "Checking Build folder..."
          ls -la apps/portfolio/dist/projects/midnight-circuit-webgl/Build

          echo "Checking required files..."
          test -f apps/portfolio/dist/projects/midnight-circuit-webgl/index.html
          test -f apps/portfolio/dist/projects/midnight-circuit-webgl/Build/MidnightCircuit-WebGL.loader.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portfolio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
